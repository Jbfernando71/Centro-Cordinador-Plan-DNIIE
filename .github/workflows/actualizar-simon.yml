        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4

      - name: Consultar aviso específico de Trudy
        run: |
          python -m py_compile actualizar_trudy_v1.py
          python actualizar_trudy_v1.py

      - name: Validar y conservar datos verificados
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool datos_trudy.json > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos_trudy.json

          if git diff --cached --quiet; then
            echo 'No hay cambios meteorológicos que publicar.'
          else
            git commit -m 'Actualizar aviso oficial SMN de Trudy'
            publicado=false

            for intento in 1 2 3; do
              echo "Intento de publicación $intento de 3"
              if git push origin HEAD:main; then
                publicado=true
                break
              fi

              echo 'La rama remota cambió. Sincronizando antes de reintentar...'
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'CONFLICTO: alguien modificó los mismos datos. No se sobrescribirá información.'
                echo 'Vuelve a ejecutar el workflow para recalcular desde la última versión.'
                exit 1
              fi
            done

            if [ "$publicado" != true ]; then
              echo 'No se logró publicar después de tres intentos. No se forzó ningún cambio.'
              exit 1
            fi
          fi

      - name: Preparar página
        run: |
          mkdir -p dist
          cp index.html datos_trudy.json rodela.png plan-dniii-e.png dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
