name: Actualizar Trudy y publicar dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - datos_trudy.json
      - actualizar_trudy_v1.py
      - .github/workflows/actualizar-simon.yml
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-trudy
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install beautifulsoup4
      - name: Consultar aviso específico de Trudy
        run: |
          python -m py_compile actualizar_trudy_v1.py
          python actualizar_trudy_v1.py
      - name: Validar y conservar datos verificados
        run: |
          python -m json.tool datos_trudy.json > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos_trudy.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar aviso oficial SMN de Trudy'
            git push
          fi
      - name: Preparar página
        run: |
          mkdir -p dist
          cp index.html datos_trudy.json rodela.png plan-dniii-e.png dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
