name: Actualizar Trudy - SMN CONAGUA

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: actualizacion-trudy-main
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4

      - name: Consultar aviso específico de Trudy
        run: |
          set -euo pipefail
          test -f actualizar_trudy_v1.py
          test -f datos_trudy.json
          python -m py_compile actualizar_trudy_v1.py
          python actualizar_trudy_v1.py

      - name: Validar archivo JSON
        run: |
          python -m json.tool datos_trudy.json > /dev/null
          python - <<'PY'
          import json
          with open('datos_trudy.json', encoding='utf-8') as f:
              d = json.load(f)
          if d.get('ciclon') != 'Trudy':
              raise SystemExit('ERROR: el JSON no corresponde a Trudy')
          if not isinstance(d.get('aviso'), int) or d['aviso'] <= 0:
              raise SystemExit('ERROR: falta un número de aviso válido')
          print('Datos de Trudy validados: aviso', d['aviso'])
          PY

      - name: Sincronizar y guardar exclusivamente datos verificados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- datos_trudy.json

          if git diff --cached --quiet; then
            echo 'Sin cambios en datos_trudy.json; no es necesario publicar.'
            exit 0
          fi

          git commit -m 'Actualizar aviso oficial SMN de Trudy'

          for intento in 1 2 3; do
            echo "Intento de publicación ${intento}/3"
            if git push origin HEAD:main; then
              echo 'Archivo publicado correctamente en main.'
              exit 0
            fi

            echo 'La rama principal cambió: obteniendo actualizaciones remotas.'
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'CONFLICTO: cambios simultáneos en los mismos archivos.'
              echo 'No se sobrescribirán datos. Ejecuta de nuevo el workflow.'
              exit 1
            fi
          done

          echo 'No se pudo publicar tras tres intentos; sin cambios forzados.'
          exit 1
